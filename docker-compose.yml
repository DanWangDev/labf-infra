services:
  db:
    image: postgres:17-alpine
    container_name: labf-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hub_dev_password}
    volumes:
      - labf-pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - labf-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: labf-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@labf.app}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5040:80"
    networks:
      - labf-net

volumes:
  labf-pgdata:

networks:
  labf-net:
    external: true
    name: labf-net
